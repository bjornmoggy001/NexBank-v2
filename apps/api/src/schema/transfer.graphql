enum TransferStatus {
    PENDING
    COMPLETED
    FAILED
    REVERSED
}

type TransferResult {
    reference: String!
    fromAccountId: ID!
    toAccountId: ID!
    amountCents: BigInt!
    currency: Currency!
    description: String!
    createdAt: String!
}

type TransferHistoryEntry {
    id: ID!
    reference: String!
    fromAccountId: ID!
    toAccountId: ID!
    fromAccountNumber: String!
    toAccountNumber: String!
    senderName: String!
    recipientName: String!
    amountCents: BigInt!
    currency: Currency!
    note: String
    status: TransferStatus!
    createdAt: String!
}

type PaginatedTransfers {
    transfers: [TransferHistoryEntry!]!
    total: Int!
    page: Int!
    pageSize: Int!
}

input TransferInput {
    fromAccountId: ID!
    toAccountId: ID!
    amountCents: BigInt!
    currency: Currency!
    note: String
}

extend type Query {
    transferHistory(accountId: ID!, page: Int =1, pageSize: Int = 20): PaginatedTransfers!
}
extend type Mutation {
    transfer(input: TransferInput!): TransferResult!
}