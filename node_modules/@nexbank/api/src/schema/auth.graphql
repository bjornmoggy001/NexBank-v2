type AuthPayload {
    accessToken: String!
}

type RefreshPayload{
    accessToken: String!
}

input RegisterInput {
    email: String!
    password: String!
    firstName: String!
    lastName: String!
    phone: String
    country: String
}

extend type Query{
    checkAuth: String!
}

extend type Mutation {
    register(input: RegisterInput!): AuthPayload
    login(email: String!, password: String!): AuthPayload
    refreshToken: RefreshPayload!
    logout: Boolean!
    logoutAllDevices: Boolean!
}
